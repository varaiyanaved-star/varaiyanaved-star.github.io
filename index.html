<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lal Bhai Taxi | Premium Rides</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        
        .mesh-gradient {
            background-color: #4338ca;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-whatsapp {
            background-color: #25D366;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        .pulse-green {
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
    </style>
</head>
<body class="bg-[#0f1115] text-gray-100">

    <nav class="fixed w-full top-0 z-50 glass border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🚕</span>
                <span class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400 uppercase">
                    Lal Bhai Taxi
                </span>
            </div>
            <a href="tel:9925063614" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-full text-sm font-bold transition-all">
                Call Now
            </a>
        </div>
    </nav>

    <section id="home" class="mesh-gradient pt-40 pb-24 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">Your Premium Ride,<br><span class="text-indigo-400">Anytime.</span></h1>
            <p class="text-gray-400 text-lg mb-10">Safe, reliable, and professional taxi service in Ahmedabad. Book in seconds.</p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="tel:9925063614" class="bg-white text-black px-8 py-4 rounded-2xl font-bold text-lg hover:bg-gray-200 transition-all flex items-center gap-2">
                    📞 Call 9925063614
                </a>
                <a href="https://wa.me/9925063614?text=Hi, I want to book a taxi." target="_blank" class="btn-whatsapp text-white px-8 py-4 rounded-2xl font-bold text-lg flex items-center gap-2">
                    💬 WhatsApp Us
                </a>
            </div>
        </div>
    </section>

    <section id="estimator" class="py-20 px-6 bg-[#0c0d11]">
        <div class="max-w-2xl mx-auto">
            <div class="glass p-8 md:p-12 rounded-[2.5rem] border border-white/10 shadow-2xl">
                <h2 class="text-3xl font-bold mb-8 text-center">Fare Estimator</h2>
                
                <div class="mb-8">
                    <label class="block text-xs font-bold text-indigo-400 uppercase tracking-widest mb-4 text-center">Approximate Distance (KM)</label>
                    <input id="manual-km" type="number" placeholder="Enter KM" 
                        class="w-full bg-white/5 border-2 border-white/10 rounded-2xl px-6 py-5 text-4xl font-black text-center focus:outline-none focus:border-indigo-500 transition-all text-white">
                </div>

                <button onclick="calculateManualFare()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-5 rounded-2xl transition-all shadow-lg mb-8">
                    ✨ Calculate Price
                </button>

                <div id="fare-result" class="hidden border-t border-white/10 pt-8 text-center animate-fade-in">
                    <div class="bg-indigo-600/10 px-10 py-6 rounded-3xl border border-indigo-500/20 mb-8">
                        <p class="text-indigo-400 text-xs font-bold uppercase mb-1">Estimated Fare</p>
                        <p id="res-price" class="text-6xl font-black text-white">₹0</p>
                    </div>
                    
                    <div class="flex flex-col gap-4">
                        <a id="wa-dynamic-btn" href="https://wa.me/9925063614" target="_blank" class="btn-whatsapp text-white px-10 py-5 rounded-2xl font-black text-xl flex items-center justify-center gap-3 pulse-green">
                            💬 Book via WhatsApp
                        </a>
                        <a href="tel:9925063614" class="bg-white text-black px-10 py-5 rounded-2xl font-black text-xl flex items-center justify-center gap-3">
                            📞 Call to Confirm
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="fixed bottom-6 right-6 flex flex-col gap-4 z-50">
        <a href="https://wa.me/9925063614" target="_blank" class="w-16 h-16 btn-whatsapp rounded-full flex items-center justify-center shadow-2xl pulse-green hover:scale-110 transition-transform">
            <svg class="w-10 h-10 fill-white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </a>
        <a href="tel:9925063614" class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-transform">
            <span class="text-3xl">📞</span>
        </a>
    </div>

    <footer class="bg-black py-16 px-6 text-center border-t border-white/5">
        <p class="text-gray-600 text-sm uppercase tracking-widest">© 2026 Lal Bhai Taxi Service. Ahmedabad.</p>
    </footer>

    <script>
        function calculateManualFare() {
            const kmInput = document.getElementById('manual-km').value;
            const resPrice = document.getElementById('res-price');
            const resultDiv = document.getElementById('fare-result');
            const waDynamicBtn = document.getElementById('wa-dynamic-btn');

            if (!kmInput || kmInput <= 0) {
                alert("Please enter a valid distance in KM.");
                return;
            }

            const km = parseFloat(kmInput);
            const baseKm = 80;
            const basePrice = 1900;
            const extraPerKm = 12;

            let totalFare = (km <= baseKm) ? basePrice : basePrice + ((km - baseKm) * extraPerKm);
            totalFare = Math.round(totalFare);

            // Update UI
            resPrice.innerText = "₹" + totalFare;
            resultDiv.classList.remove('hidden');

            // Generate WhatsApp Link with details
            const message = `Hello Lal Bhai Taxi, I want to book a ride for approximately ${km} KM. The fare shown is ₹${totalFare}. Please confirm booking.`;
            waDynamicBtn.href = `https://wa.me/9925063614?text=${encodeURIComponent(message)}`;
            
            // Scroll to show results
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
